<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Translator - Translate Any Language</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%); /* Orange to yellow gradient */
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: rgba(255, 255, 255, 0.9);
            padding: 2rem;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            flex: 1;
        }
        .translator {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        textarea, select {
            width: 100%;
            padding: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }
        button {
            background: #ff7e5f; /* Orange button to match theme */
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }
        button:hover {
            background: #e55a3c; /* Darker orange on hover */
        }
        .swap {
            text-align: center;
            margin: 1rem 0;
        }
        .swap button {
            background: #feb47b; /* Yellow button for swap */
        }
        .swap button:hover {
            background: #f5a623; /* Darker yellow on hover */
        }
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Universal Translator</h1>
        <p>Translate text between any languages instantly!</p>
    </header>

    <div class="container">
        <div class="translator">
            <div>
                <label for="source-lang">From Language:</label>
                <select id="source-lang">
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="zh">Chinese</option>
                    <option value="ja">Japanese</option>
                    <option value="ar">Arabic</option>
                    <option value="hi">Hindi</option>
                    <!-- Add more languages as needed -->
                </select>
                <textarea id="source-text" placeholder="Enter text to translate..." rows="10"></textarea>
            </div>
            <div>
                <label for="target-lang">To Language:</label>
                <select id="target-lang">
                    <option value="es">Spanish</option>
                    <option value="en">English</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="zh">Chinese</option>
                    <option value="ja">Japanese</option>
                    <option value="ar">Arabic</option>
                    <option value="hi">Hindi</option>
                    <!-- Add more languages as needed -->
                </select>
                <textarea id="target-text" placeholder="Translation will appear here..." rows="10" readonly></textarea>
            </div>
        </div>
        <div class="swap">
            <button onclick="swapLanguages()">Swap Languages</button>
        </div>
        <button onclick="translateText()">Translate</button>
    </div>

    <footer>
        <p>&copy; 2023 Universal Translator. Powered by [Your API]. For demo only.</p>
    </footer>

    <script>
        function translateText() {
            const sourceText = document.getElementById('source-text').value;
            const sourceLang = document.getElementById('source-lang').value;
            const targetLang = document.getElementById('target-lang').value;
            
            // Placeholder translation (replace with real API call)
            let translation = "This is a demo. Real translation requires an API like Google Translate.";
            if (sourceText.toLowerCase().includes("hello")) {
                translation = targetLang === "es" ? "Hola" : targetLang === "fr" ? "Bonjour" : "Hello (translated)";
            }
            
            document.getElementById('target-text').value = translation;
        }

        function swapLanguages() {
            const sourceLang = document.getElementById('source-lang');
            const targetLang = document.getElementById('target-lang');
            const temp = sourceLang.value;
            sourceLang.value = targetLang.value;
            targetLang.value = temp;
        }
    </script>
</body>
</html>
